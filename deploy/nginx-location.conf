# Reverse-Proxy-Block fuer die bestehende Website (nginx).
# In den vorhandenen server { ... }-Block einfuegen.
#
# Achtung: Die Pfade /instagram/ und /media/instagram/ muessen frei sein. Kollidiert einer mit der
# bestehenden Seite (z. B. mit einem vorhandenen /instagram/-Verzeichnis des CMS), entweder dort
# aufraeumen oder Instagram__PublicBasePath / Instagram__MediaUrlPrefix umstellen - dann aber auch
# die Einbindung in der Homepage anpassen.

location ^~ /instagram/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location ^~ /media/instagram/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Bilder sind unveraenderlich (Dateiname = Beitrags-ID): einen Tag cachen ist unkritisch.
    expires 1d;
    add_header Cache-Control "public";
}

# Zustandsabfrage nur von localhost aus (Monitoring), nicht aus dem Netz.
location = /healthz {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8080;
}
